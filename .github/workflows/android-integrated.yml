name: android-integrated-workspace
on:
  workflow_dispatch:
    inputs:
      native_run:
        description: Reuse successful native runtime jobs with identical sources
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: inputs.native_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
      - name: Build embedded native runtime
        env:
          SHELLPILOT_INTEGRATED: '1'
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: bash scripts/build-android-runtime.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-native-${{ matrix.arch }}
          path: runtime-build/*.tar.gz
  main:
    needs: [native, native-reuse]
    if: always() && (needs.native.result == 'success' || needs.native-reuse.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: integrated-native-*
          merge-multiple: true
          path: runtime-build/native
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: python3 scripts/integrated-runtime-manifest.py runtime-build/native
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - run: npm run tauri -- android init
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      - run: node scripts/prepare-android-workspace.mjs
        env:
          SHELLPILOT_NATIVE_DIR: runtime-build/native
      - run: node scripts/patch-android.mjs
      - name: Build isolated child-process boundary fixture
        run: bash scripts/build-workspace-probe.sh
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      - run: npm run tauri -- android build --apk --target x86_64
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      - name: Sign main fixture with permanent key
        env:
          KEY_B64: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > /tmp/integrated-signing.p12
          trap 'rm -f /tmp/integrated-signing.p12' EXIT
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*' | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/integrated-signing.p12 --ks-key-alias shellpilot --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out runtime-build/ShellPilot-x86_64-test.apk "$apk"
          export SIGNING_KEY_PATH=/tmp/integrated-signing.p12
          bash scripts/build-integrated-test.sh
          bash scripts/build-runtime-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-main
          path: |
            runtime-build/ShellPilot-x86_64-test.apk
            runtime/manifest.json
            runtime-build/native/native-manifest.json
            runtime-build/integrated-test/signed.apk
            runtime-build/instrumentation/signed.apk
  device:
    needs: main
    if: always() && needs.main.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            legacy: false
          - api: 35
            legacy: false
          - api: 30
            legacy: true
    env:
      LEGACY: ${{ matrix.legacy }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: integrated-main
          path: runtime-build/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Obtain old component only for migration fixtures
        if: matrix.legacy
        run: |
          mkdir -p runtime-build/legacy
          gh release download linux-alpine-3.24.4-v2 --repo "$GITHUB_REPOSITORY" --pattern ShellPilot-Linux-Android-x86_64.apk --dir runtime-build/legacy
          printf 'cb6b0b4eea5337e6c5a63c6586bb23eae142ad64abf8c01c88c7c547e59bb6b3  runtime-build/legacy/ShellPilot-Linux-Android-x86_64.apk\n' | sha256sum --check
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            if test "$LEGACY" = true; then adb install runtime-build/legacy/ShellPilot-Linux-Android-x86_64.apk; adb install runtime-build/main/runtime-build/instrumentation/signed.apk; adb shell 'echo PRIVATE_CANARY > /data/local/tmp/shellpilot-private-canary; chmod 600 /data/local/tmp/shellpilot-private-canary'; adb shell am instrument -w app.shellpilot.workspace.test/.RuntimeTest | tee runtime-build/legacy.txt; grep -F 'PASS: Android PRoot' runtime-build/legacy.txt; fi
            adb install runtime-build/main/runtime-build/ShellPilot-x86_64-test.apk
            if test "$LEGACY" = true; then SHELLPILOT_LEGACY_TEST=1 python3 scripts/verify-android-integrated.py; else python3 scripts/verify-android-integrated.py; fi
            WORKSPACE_TEST_URL=http://127.0.0.1:3738 node scripts/verify-workspace-terminals.mjs
            adb install runtime-build/main/runtime-build/integrated-test/signed.apk
            adb shell am instrument -w app.shellpilot.client.test/.IntegratedRuntimeTest | tee runtime-build/boundary-check.txt
            grep -F 'PASS: main-app credential' runtime-build/boundary-check.txt
  native-reuse:
    if: inputs.native_run != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original native sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.native_run }}
          ARCH: ${{ matrix.arch }}
        run: |
          source=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN --jq .head_sha)
          git diff --exit-code "$source" HEAD -- scripts/build-android-runtime.sh scripts/patch-proot-network.py scripts/patch-proot-workspace.py runtime/android/terminal.c
          state=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs --jq ".jobs[] | select(.name == \"native ($ARCH)\") | .conclusion")
          test "$state" = success
      - uses: actions/download-artifact@v4
        with:
          name: integrated-native-${{ matrix.arch }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: runtime-build/native
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-native-${{ matrix.arch }}
          path: runtime-build/native/*.tar.gz

name: linux-runtime
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils qemu-system-x86 e2fsprogs
      - run: bash scripts/build-linux-guest.sh
      - run: python3 scripts/verify-linux-guest.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-guest
          path: runtime-build/ShellPilot-Linux-Guest.tar.gz
  qemu:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-qemu mingw-w64-ucrt-x86_64-binutils
      - run: python scripts/package-qemu-windows.py "${{ steps.msys.outputs.msys2-location }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-qemu
          path: runtime-build/ShellPilot-QEMU-Windows.tar.gz
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
      - name: Build signed Android Linux component
        env:
          KEY_B64: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_PASSWORD }}
          CERT_SHA256: ${{ vars.SHELLPILOT_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > /tmp/runtime-signing.p12
          trap 'rm -f /tmp/runtime-signing.p12' EXIT
          export SIGNING_KEY_PATH=/tmp/runtime-signing.p12
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/build-android-runtime.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-android-${{ matrix.arch }}
          path: |
            runtime-build/ShellPilot-Linux-Android-${{ matrix.arch }}.apk
            runtime-build/ShellPilot-Linux-Android-${{ matrix.arch }}-sources.tar.gz
  windows-check:
    needs: [guest, qemu]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: server-rs -> target
      - uses: actions/download-artifact@v4
        with:
          name: linux-guest
          path: runtime-build/downloads
      - uses: actions/download-artifact@v4
        with:
          name: linux-qemu
          path: runtime-build/downloads
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-build/guest-runtime,runtime-build/qemu-runtime | Out-Null
          tar -xzf runtime-build/downloads/ShellPilot-Linux-Guest.tar.gz -C runtime-build/guest-runtime
          tar -xzf runtime-build/downloads/ShellPilot-QEMU-Windows.tar.gz -C runtime-build/qemu-runtime
      - run: npm ci
      - run: npm run build
      - run: cargo build --manifest-path server-rs/Cargo.toml
      - run: node scripts/verify-linux-windows.mjs
  android-check:
    needs: [android, main-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: linux-android-x86_64
          path: runtime-build/component
      - uses: actions/download-artifact@v4
        with:
          name: linux-main-fixture
          path: runtime-build/main-app
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build signed fixture tests
        env:
          KEY_B64: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > /tmp/runtime-signing.p12
          trap 'rm -f /tmp/runtime-signing.p12' EXIT
          export SIGNING_KEY_PATH=/tmp/runtime-signing.p12
          bash scripts/build-runtime-test.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install runtime-build/component/ShellPilot-Linux-Android-x86_64.apk
            adb install runtime-build/instrumentation/signed.apk
            adb shell 'echo PRIVATE_CANARY > /data/local/tmp/shellpilot-private-canary; chmod 600 /data/local/tmp/shellpilot-private-canary'
            adb shell am instrument -w app.shellpilot.workspace.test/.RuntimeTest | tee runtime-build/android-test.txt
            grep -F 'PASS: Android PRoot' runtime-build/android-test.txt
            adb install runtime-build/main-app/ShellPilot-x86_64-test.apk
            python3 scripts/verify-android-main.py
  main-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - run: npm run tauri -- android init
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      - run: node scripts/patch-android.mjs
      - run: npm run tauri -- android build --apk --target x86_64
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      - name: Sign emulator fixture with existing key
        env:
          KEY_B64: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > /tmp/runtime-signing.p12
          trap 'rm -f /tmp/runtime-signing.p12' EXIT
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*' | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/runtime-signing.p12 --ks-key-alias shellpilot --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out runtime-build/ShellPilot-x86_64-test.apk "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-main-fixture
          path: runtime-build/ShellPilot-x86_64-test.apk

name: verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-workspace:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: server-rs -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - run: cargo build --manifest-path server-rs/Cargo.toml
      - run: cargo test --manifest-path server-rs/Cargo.toml --lib workspace
      - run: node scripts/verify-workspace-windows.mjs
      - run: node scripts/verify-backup.mjs
      - run: node scripts/verify-terminal-latency.mjs
  windows-reading:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-brand.mjs
      - run: node scripts/verify-workspace-upload.mjs
      - name: Verify Windows font metrics and reading interactions
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
          $nodeRuntime = (Get-Command node).Source
          $viteEntry = (Resolve-Path node_modules/vite/bin/vite.js).Path
          $preview = Start-Process -FilePath $nodeRuntime -ArgumentList @($viteEntry, 'preview', '--host', '127.0.0.1', '--port', '4173') -WindowStyle Hidden -PassThru
          try {
            node scripts/verify-reading-terminal.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Windows terminal reading checks failed' }
            node scripts/verify-terminal-history-ui.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Windows terminal history checks failed' }
            node scripts/verify-storage-ui.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Windows storage checks failed' }
          } finally {
            Stop-Process -Id $preview.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reading-screenshots
          path: layout-screenshots/*.png
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: server-rs -> target
          cache-on-failure: true
      - run: npm ci
      - name: Verify supplied avatar and generate native icons
        run: |
          npm run icon
          node scripts/verify-icon.mjs
          npm run tauri -- icon build/icon.png
          node scripts/set-icon-background.mjs
      - run: npm run build
      - run: node scripts/verify-scope.mjs
      - run: node scripts/verify-brand.mjs
      - run: cargo test --manifest-path server-rs/Cargo.toml
      - name: Data failure and recovery integration
        run: node scripts/verify-storage.mjs
      - name: Selective encrypted backup integration
        run: node scripts/verify-backup.mjs
      - name: Agent and MCP integration
        run: node scripts/verify-agent.mjs
      - name: Batch commands use the shared execution policy
        run: node scripts/verify-batch-exec.mjs
      - name: Real Bash and Zsh terminal command history
        run: |
          command -v zsh || (sudo apt-get update -qq && sudo apt-get install -y -qq zsh)
          node scripts/verify-terminal-history.mjs
      - name: Typing stays responsive during other terminal connections
        run: node scripts/verify-terminal-latency.mjs
      - name: Browser layout verification
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/shellpilot-vite.log 2>&1 &
          for attempt in $(seq 1 50); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 0.2; done
          node scripts/verify-layout.mjs
          node scripts/verify-memory-ui.mjs
          node scripts/verify-reading-terminal.mjs
          node scripts/verify-chat-changes.mjs
          node scripts/verify-workspace-ui.mjs
          node scripts/verify-backup-ui.mjs
          node scripts/verify-terminal-history-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-screenshots
          path: layout-screenshots/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-sources
          path: server-rs/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: shellpilot-icons
          path: |
            build/icon.png
            src-tauri/icons/

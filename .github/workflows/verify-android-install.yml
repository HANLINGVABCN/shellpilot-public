name: verify-android-install
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reused main app sources
        run: |
          source=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/42601144971 --jq .head_sha)
          git diff --exit-code "$source" HEAD -- src public server-rs src-tauri runtime/manifest.json scripts/patch-android.mjs package.json package-lock.json index.html vite.config.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: linux-main-fixture
          run-id: 42601144971
          github-token: ${{ github.token }}
          path: runtime-build/main-app
      - name: Obtain fixed signed component
        run: |
          mkdir -p runtime-build/component
          gh release download linux-alpine-3.24.4-v1 --repo HANLINGVABCN/shellpilot-public --pattern ShellPilot-Linux-Android-x86_64.apk --dir runtime-build/component
          printf '7d8590240b924984e75b62b2963e1e26325b33c459cf5d12fab0e149ea61c69f  runtime-build/component/ShellPilot-Linux-Android-x86_64.apk\n' | sha256sum --check
      - name: Build signature-compatible fixture tests
        env:
          KEY_B64: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > /tmp/runtime-signing.p12
          trap 'rm -f /tmp/runtime-signing.p12' EXIT
          export SIGNING_KEY_PATH=/tmp/runtime-signing.p12
          bash scripts/build-runtime-test.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install runtime-build/component/ShellPilot-Linux-Android-x86_64.apk
            adb install runtime-build/instrumentation/signed.apk
            adb shell 'echo PRIVATE_CANARY > /data/local/tmp/shellpilot-private-canary; chmod 600 /data/local/tmp/shellpilot-private-canary'
            adb shell am instrument -w app.shellpilot.workspace.test/.RuntimeTest | tee runtime-build/fixture-test.txt
            grep -F 'PASS: Android PRoot' runtime-build/fixture-test.txt
            adb install runtime-build/main-app/ShellPilot-x86_64-test.apk
            python3 scripts/verify-android-main.py

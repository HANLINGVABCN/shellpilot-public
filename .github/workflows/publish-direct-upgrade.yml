name: 发布 Windows 直接覆盖更新安装程序
on:
  workflow_dispatch:
    inputs:
      runner:
        description: '本次实验服务器发布运行器标签'
        required: true
permissions:
  contents: write
concurrency:
  group: shellpilot-experimental-packaging
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && startsWith(inputs.runner, 'shellpilot-public-upgrade-') && github.repository == 'HANLINGVABCN/shellpilot-public'
    runs-on: [self-hosted, Linux, ARM64, '${{ inputs.runner }}']
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 核对应用源码与原 1.0.4 产物一致
        run: |
          set -euo pipefail
          git diff --exit-code 0935c77248757e28cb174a1ba3a3f29da87a3907 HEAD -- src public server-rs runtime index.html package.json package-lock.json vite.config.mjs src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/src src-tauri/icons
          python3 - <<'PY'
          from pathlib import Path
          assert Path('src-tauri/installer.nsi').read_text()==Path('/opt/shellpilot-build/direct-upgrade-20261118/source/src-tauri/installer.nsi').read_text(),'安装模板内容不一致'
          PY
      - name: 复用已签名 APK 和便携包并收集修正安装程序
        run: |
          set -euo pipefail
          mkdir release-installers
          cp /opt/shellpilot-build/direct-upgrade-20261118/ShellPilot-arm64.apk release-installers/
          cp /opt/shellpilot-build/direct-upgrade-20261118/ShellPilot-portable.zip release-installers/
          cp /opt/shellpilot-build/direct-upgrade-20261118/ShellPilot-Windows-Setup.exe release-installers/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,subprocess
          r=Path('release-installers')
          old=json.loads(subprocess.check_output(['gh','api','repos/HANLINGVABCN/shellpilot-public/releases/tags/build-20261118-v1.0.4'],text=True))
          for name in ['ShellPilot-arm64.apk','ShellPilot-portable.zip']:
              asset=next(a for a in old['assets'] if a['name']==name)
              b=(r/name).read_bytes()
              assert len(b)==asset['size'] and 'sha256:'+hashlib.sha256(b).hexdigest()==asset['digest']
          exe=Path('/opt/shellpilot-build/runner/_work/shellpilot/shellpilot/src-tauri/target/x86_64-pc-windows-msvc/release/shellpilot-app.exe').read_bytes()
          with zipfile.ZipFile(r/'ShellPilot-portable.zip') as z: assert z.read('ShellPilot.exe')==exe
          installer=(r/'ShellPilot-Windows-Setup.exe').read_bytes()
          assert installer.startswith(b'MZ')
          old_installer=next(a for a in old['assets'] if a['name']=='ShellPilot-Windows-Setup.exe')
          assert 'sha256:'+hashlib.sha256(installer).hexdigest()!=old_installer['digest']
          packages=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in r.iterdir()]
          info={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'version':'1.0.4','applicationBinaryUnchanged':True,'androidAndPortableUnchanged':True,'packages':packages}
          Path('build-info.json').write_text(json.dumps(info,indent=2))
          print(json.dumps(info))
          PY
          (cd release-installers && sha256sum ShellPilot-arm64.apk ShellPilot-Windows-Setup.exe ShellPilot-portable.zip > SHA256SUMS.txt)
      - name: 从实验服务器上传四个正式附件到草稿
        run: |
          set -euo pipefail
          cp /opt/shellpilot-build/direct-upgrade-20261118/release-notes.md release-notes.md
          printf '%s\n' '' "构建源码：$GITHUB_SHA" "验证发布：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> release-notes.md
          gh release create build-20261118-direct-update release-installers/* --draft --title 'ShellPilot 1.0.4：Windows 直接覆盖更新' --target "$GITHUB_SHA" --notes-file release-notes.md

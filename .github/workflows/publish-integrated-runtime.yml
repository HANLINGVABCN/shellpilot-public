name: publish-integrated-runtime
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful integrated runtime/device run
        required: true
      main_run:
        description: Original main/native build if device run reused it
        required: false
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and completed devices
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs --jq '[.jobs[] | select(.name | startswith("device")) | select(.conclusion == "success")] | length')" -ge 3
          if test -n '${{ inputs.main_run }}'; then original='${{ inputs.main_run }}'; else original="$SOURCE_RUN"; fi
          printf 'ORIGINAL_BUILD=%s\n' "$original" >> "$GITHUB_ENV"
          original_sha=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$original --jq .head_sha)
          git diff --exit-code "$original_sha" HEAD -- src server-rs src-tauri runtime/android/IntegratedWorkspaceService.java runtime/android/WorkspaceBridge.kt scripts/patch-android.mjs scripts/patch-proot-workspace.py scripts/patch-proot-network.py scripts/build-android-runtime.sh
          source=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN --jq .head_sha)
          git diff --exit-code "$source" HEAD -- runtime/android/IntegratedWorkspaceService.java runtime/android/WorkspaceBridge.kt scripts/patch-proot-workspace.py scripts/patch-proot-network.py scripts/build-android-runtime.sh scripts/patch-android.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: integrated-native-*
          run-id: ${{ env.ORIGINAL_BUILD }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: runtime-assets
      - uses: actions/download-artifact@v4
        with:
          name: integrated-main
          run-id: ${{ env.ORIGINAL_BUILD }}
          github-token: ${{ github.token }}
          path: runtime-main
      - name: Publish data and build-only native runtime
        run: |
          set -euo pipefail
          tag=linux-alpine-3.24.4-integrated-v1
          cp runtime-main/runtime-build/native/native-manifest.json runtime-assets/native-manifest.json
          (cd runtime-assets && sha256sum ./*.tar.gz > SHA256SUMS.txt)
          gh release create "$tag" runtime-assets/* --target "$GITHUB_SHA" --title 'ShellPilot · 内置工作区运行文件' --notes 'Linux根文件系统供工作区页面按需下载解压，不是APK。原生程序只用于构建并随主应用签名发布，不在手机上额外安装。两架构编译、安卓10/15实际单应用运行、文件、终端和访问边界检查通过。Windows继续复用原运行组件。' --prerelease --latest=false
          python3 - <<'PY'
          import pathlib,json,subprocess
          manifest=json.load(open('runtime-main/runtime/manifest.json'))
          release=json.loads(subprocess.check_output(['gh','api','repos/HANLINGVABCN/shellpilot-public/releases/tags/linux-alpine-3.24.4-integrated-v1']))
          assets={asset['name']:asset for asset in release['assets']}
          for key in ['android-arm64','android-x86_64']:
              package=manifest['packages'][key];asset=assets[package['file']]
              package['urls']=[asset['browser_download_url'],asset['url']]+package['urls']
          pathlib.Path('runtime-assets/runtime-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          gh release upload "$tag" runtime-assets/runtime-manifest.json

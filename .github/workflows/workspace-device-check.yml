name: workspace-device-check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: server-rs -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - run: cargo build --manifest-path server-rs/Cargo.toml
      - name: Reuse fixed Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-build/downloads,runtime-build/guest-runtime,runtime-build/qemu-runtime | Out-Null
          gh release download linux-alpine-3.24.4-v1 --repo HANLINGVABCN/shellpilot-public --pattern ShellPilot-Linux-Guest.tar.gz --pattern ShellPilot-QEMU-Windows.tar.gz --dir runtime-build/downloads
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash runtime-build/downloads/ShellPilot-Linux-Guest.tar.gz).Hash.ToLower() -ne 'de4b31afd388f90bcd63f31ca600b6690fc6ad9ec58052a29109a1413759e80b') { throw 'Guest checksum mismatch' }
          if ((Get-FileHash runtime-build/downloads/ShellPilot-QEMU-Windows.tar.gz).Hash.ToLower() -ne '2296c128d7f56ffe8983392c01a1fe7d1730e481720785a63a71498f825ad5af') { throw 'QEMU checksum mismatch' }
          tar -xzf runtime-build/downloads/ShellPilot-Linux-Guest.tar.gz -C runtime-build/guest-runtime
          tar -xzf runtime-build/downloads/ShellPilot-QEMU-Windows.tar.gz -C runtime-build/qemu-runtime
      - run: node scripts/verify-linux-windows.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-windows-logs
          path: runtime-build/**/*.log
  android:
    needs: main-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: linux-main-fixture
          path: runtime-build/main-app
      - name: Obtain fixed signed component
        run: |
          mkdir -p runtime-build/component
          gh release download linux-alpine-3.24.4-v2 --repo "$GITHUB_REPOSITORY" --pattern ShellPilot-Linux-Android-x86_64.apk --dir runtime-build/component
          python3 - <<'PY'
          import json,pathlib,hashlib
          package=json.load(open('runtime/manifest.json'))['packages']['android-x86_64']
          file=pathlib.Path('runtime-build/component')/package['file']
          assert hashlib.sha256(file.read_bytes()).hexdigest()==package['sha256']
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install runtime-build/component/ShellPilot-Linux-Android-x86_64.apk
            adb install runtime-build/main-app/ShellPilot-x86_64-test.apk
            python3 scripts/verify-android-main.py
            WORKSPACE_TEST_URL=http://127.0.0.1:3738 node scripts/verify-workspace-terminals.mjs
  main-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - run: npm run tauri -- android init
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      - run: node scripts/patch-android.mjs
      - run: npm run tauri -- android build --apk --target x86_64
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      - name: Sign emulator fixture with existing key
        env:
          KEY_B64: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          mkdir -p runtime-build
          printf '%s' "$KEY_B64" | base64 --decode > /tmp/runtime-signing.p12
          trap 'rm -f /tmp/runtime-signing.p12' EXIT
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*' | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/runtime-signing.p12 --ks-key-alias shellpilot --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out runtime-build/ShellPilot-x86_64-test.apk "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-main-fixture
          path: runtime-build/ShellPilot-x86_64-test.apk

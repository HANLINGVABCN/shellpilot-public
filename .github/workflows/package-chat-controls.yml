name: 实验服务器双端 AI 布局正式打包
on:
  workflow_dispatch:
    inputs:
      runner:
        description: '本次实验服务器专用运行器标签'
        required: true
permissions:
  contents: write
concurrency:
  group: shellpilot-experimental-packaging
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main' && startsWith(inputs.runner, 'shellpilot-public-chat-') && github.repository == 'HANLINGVABCN/shellpilot-public'
    runs-on: [self-hosted, Linux, ARM64, '${{ inputs.runner }}']
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 复制已审阅的临时打包脚本并核验摘要
        run: |
          mkdir -p build/chat-packaging
          cp /opt/shellpilot-build/chat-packaging-20261118/* build/chat-packaging/
          (cd build/chat-packaging && sha256sum --check SHA256SUMS.txt)
      - name: 核验公开主分支与构建AI 控件前端
        run: bash build/chat-packaging/package-experimental.sh prepare
      - name: 编译 Windows 1.0.3 安装程序与便携包
        run: bash build/chat-packaging/package-experimental.sh windows
      - name: 编译 Android 1.0.3 ARM64 安装包
        run: bash build/chat-packaging/package-experimental.sh android
      - name: 使用公开版原有永久签名并检查覆盖更新标识
        env:
          SIGNING_KEY_B64: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELLPILOT_ANDROID_KEYSTORE_PASSWORD }}
          CERT_SHA256: ${{ vars.SHELLPILOT_ANDROID_CERT_SHA256 }}
        run: bash build/chat-packaging/package-experimental.sh sign
      - name: 校验两端嵌入本次AI 控件界面及安卓页对齐
        run: bash build/chat-packaging/package-experimental.sh info
      - name: 从实验服务器上传四个正式附件到草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-installers
          cp release-experimental/android/ShellPilot-arm64.apk release-installers/
          cp release-experimental/windows/ShellPilot-Windows-Setup.exe release-installers/
          cp release-experimental/windows/ShellPilot-portable.zip release-installers/
          (cd release-installers && sha256sum ShellPilot-arm64.apk ShellPilot-Windows-Setup.exe ShellPilot-portable.zip > SHA256SUMS.txt)
          cp build/chat-packaging/release-notes.md release-notes.md
          printf '\n构建源码：%s\n验证构建：https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create build-20261118-v1.0.3 release-installers/* --draft --title 'ShellPilot 1.0.3：双端 AI 控件布局' --target "$GITHUB_SHA" --notes-file release-notes.md

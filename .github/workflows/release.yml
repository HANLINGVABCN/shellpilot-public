name: publish-verified-build
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful Windows and Android build run ID'
        required: true
        default: '42248892785'
      tag:
        description: 'New release tag'
        required: true
        default: 'build-20261107'
      title:
        description: 'Release title'
        required: true
        default: 'ShellPilot · 2026-11-07 更新'
permissions:
  contents: write
  actions: read
concurrency:
  group: shellpilot-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful build matches main sources
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN")
          test "$(jq -r .status <<< "$run")" = completed
          test "$(jq -r .conclusion <<< "$run")" = success
          source_sha=$(jq -r .head_sha <<< "$run")
          git merge-base --is-ancestor "$source_sha" HEAD
          git diff --exit-code "$source_sha" HEAD -- src public server-rs src-tauri index.html package.json package-lock.json vite.config.mjs scripts
          printf '%s\n' "BUILD_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new tag instead of replacing published files.' >&2
            exit 1
          fi
      - name: Download verified Windows files
        uses: actions/download-artifact@v4
        with:
          name: ShellPilot-windows-preview
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verified-windows
      - name: Download verified Android APK
        uses: actions/download-artifact@v4
        with:
          name: ShellPilot-android-preview
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verified-android
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          test -f verified-windows/shellpilot-app.exe
          cp verified-windows/shellpilot-app.exe release-assets/shellpilot-app.exe
          installer=$(find verified-windows -maxdepth 1 -type f -name '*.exe' ! -name 'shellpilot-app.exe' -print -quit)
          test -n "$installer"
          cp "$installer" release-assets/ShellPilot-Windows-Setup.exe
          apk=$(find verified-android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" release-assets/ShellPilot-arm64.apk
          test -f verified-android/ShellPilot-android.cer
          cp verified-android/ShellPilot-android.cer release-assets/
          cp verified-android/ANDROID-CERT-SHA256.txt release-assets/
          (cd release-assets && sha256sum ./*.exe ./*.apk > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          本次更新提升内置 AI 和外部 MCP 的运维效率，并修复安卓和 Windows 界面问题。

          - AI/MCP 共用 9 个工具：批量查询、系统诊断、服务日志、分页读文件、文件修改预览、备份与校验。
          - 支持停止任务，避免重复失败调用；完善聊天历史和完整工具结果。
          - 修复机器选择出现“4/3”的问题，清理已删除和重复的 ID；长消息支持展开、收起。
          - 安卓使用单页导航，适配输入框和安全区域；Windows 缩小默认窗口并记忆尺寸、位置及最大化状态。
          - MCP 配置自动获取程序路径；首次 SSH 连接自动保存服务器指纹并连接，以后自动比对。
          - 只有已保存的指纹变化时暂停，操作直接位于当前机器内容区，顶部标签栏固定；点击信任新指纹后自动重连，无浏览器确认弹窗或遮罩。
          - Windows 使用原生 PowerShell/CIM 采集 CPU、内存、系统盘及网络指标，列表、终端和监控保持一致。
          - 修正 MCP 机器选择及聊天机器菜单的复选框、状态点、名称、地址对齐。
          - 机器标签固定稍长宽度，连续关闭时按钮位置不变；总览和服务器列表直接显示指纹变化处理入口。
          - MCP 增加完全托管模式，按用户选定模式直接执行授权主机上的命令。
          - 最大输出、历史轮数、工具轮数和上下文预算默认全部为 0：应用不设上限，保留全部历史；旧默认值自动迁移，保留自定义配置。
          - 使用用户提供的琥珀色终端脸 SVG 作为头像，统一 Windows、安卓、托盘、浏览器和界面图标。
          - 对话列表直接显示删除按钮，支持批量删除和清空；确认在菜单内完成，无浏览器弹窗，删除当前对话后同步清理消息。
          - 长期记忆列表支持添加、编辑、删除及批量启用停用。自动记忆开关只影响主动新增，已有启用记忆继续使用；重复内容去重，手动和停用记录受保护。
          - AI 任务支持暂停继续，执行中的新消息排队并可编辑取消；重启后队列暂停恢复，继续不重放已经完成的写入。
          - 工具卡片默认显示命令与输出两行摘要，点击内容展开收起，复制和文字选择不误触。
          - 修复终端缩放后的鼠标选区错行；AI 输入框增大，向上阅读回复时不再被新输出拉到底部，可点击「回到最新」恢复跟随。
          - 网页链接交给系统默认浏览器，不再替换应用页面，普通点击和中键均支持。
          - AI 输入框默认恢复紧凑高度，整条上边缘可上下拖动，支持调大、调小、记忆高度和双击恢复默认，不再依赖右下角拖动。
          - 应用标识和安卓包名统一为 app.shellpilot.client，Windows 公司与发布者为 ShellPilot，桌面和 MCP 数据目录为 ShellPilot，不含个人命名。
          - 安卓使用固定 ShellPilot 品牌签名，发布公钥证书与指纹；后续同包名版本沿用同一证书。

          文件直接来自已通过 GitHub 测试的构建，未重新编译或重新签名。Windows 安装包、EXE MCP 测试、Android APK 签名校验及功能测试已通过。

          下载：Windows 使用 `ShellPilot-Windows-Setup.exe`；已有便携目录可替换 `shellpilot-app.exe`；安卓使用 `ShellPilot-arm64.apk`。

          此安卓版本使用新包名，会与旧包名应用分别安装；请先导出旧配置再导入新版。程序不自动处理旧数据。后续同包名更新使用固定签名。

          Windows 当前没有公信机构的代码签名证书，ShellPilot 公司和发布者字段是品牌元数据，不代表 Windows 已信任签名。
          NOTES
          printf '\n验证构建：https://github.com/%s/actions/runs/%s\n构建源码：`%s`\n' "$GITHUB_REPOSITORY" "$BUILD_RUN" "$BUILD_SOURCE_SHA" >> release-notes.md
      - name: Publish release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "$RELEASE_TITLE" --target "$GITHUB_SHA" \
            --notes-file release-notes.md --latest
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets

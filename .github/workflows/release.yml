name: publish-verified-build
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful Windows and Android build run ID'
        required: true
        default: '42603270185'
      tag:
        description: 'New release tag'
        required: true
        default: 'build-20261109-linux-workspace'
      title:
        description: 'Release title'
        required: true
        default: 'ShellPilot'
permissions:
  contents: write
  actions: read
concurrency:
  group: shellpilot-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful build matches main sources
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN")
          test "$(jq -r .status <<< "$run")" = completed
          test "$(jq -r .conclusion <<< "$run")" = success
          source_sha=$(jq -r .head_sha <<< "$run")
          git merge-base --is-ancestor "$source_sha" HEAD
          git diff --exit-code "$source_sha" HEAD -- src public server-rs src-tauri runtime/manifest.json runtime/android/WorkspaceBridge.kt index.html package.json package-lock.json vite.config.mjs scripts ':(exclude)scripts/verify-*'
          printf '%s\n' "BUILD_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new tag instead of replacing published files.' >&2
            exit 1
          fi
      - name: Download verified Windows files
        uses: actions/download-artifact@v4
        with:
          name: ShellPilot-windows-preview
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verified-windows
      - name: Download verified Android APK
        uses: actions/download-artifact@v4
        with:
          name: ShellPilot-android-preview
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verified-android
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          test -f verified-windows/shellpilot-app.exe
          cp verified-windows/shellpilot-app.exe release-assets/shellpilot-app.exe
          installer=$(find verified-windows -maxdepth 1 -type f -name '*.exe' ! -name 'shellpilot-app.exe' -print -quit)
          test -n "$installer"
          cp "$installer" release-assets/ShellPilot-Windows-Setup.exe
          apk=$(find verified-android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" release-assets/ShellPilot-arm64.apk
          test -f verified-android/ShellPilot-android.cer
          cp verified-android/ShellPilot-android.cer release-assets/
          cp verified-android/ANDROID-CERT-SHA256.txt release-assets/
          (cd release-assets && sha256sum ./*.exe ./*.apk > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          ShellPilot：内置按需安装的 Alpine Linux 工作区，统一 Windows 和安卓文件协作。

          - 工作台新增「📁 工作区」大页面，顶部统一安装、卸载、启动停止、运行状态和随软件启动设置；文件列表和手动终端在同一页面，不新增小标签或左侧服务器入口。
          - Windows 使用软件管理的 QEMU，安卓使用独立签名运行组件及 PRoot，两端使用 Alpine 3.24.4，无需 WSL 或手机 Root。
          - 只有点击安装时下载环境，固定版本与 SHA256 校验，支持暂停续传和备用入口。Windows首次约125MB，安卓arm64运行组件约4.2MB；普通更新不重复下载同一环境。
          - 默认按需启动，可手动启停和选择随软件启动；终端支持交互与尺寸变化，停止前保存文件和环境磁盘。卸载保留工作文件。
          - AI 知道安装、启用和联网状态，能说明直接服务器文件管理上传与工作区处理后上传两种方式；内置 AI 支持授权服务器流式上传下载及上传校验。
          - 保留原工作区、数据目录、记忆、任务队列和固定安卓签名；配置保存继续显示转圈与等待说明，二进制文件不会被当作文本误保存。

          [完整运行环境验收](https://github.com/HANLINGVABCN/shellpilot-public/actions/runs/42597735254)覆盖实际 Windows QEMU 启动、文件同步、真实终端、重启和卸载保留，以及安卓模拟器和主应用 JNI/Binder 上传下载。[首次下载安装验收](https://github.com/HANLINGVABCN/shellpilot-public/actions/runs/42603262341)检查实际下载、校验、系统安装URI和缓存复用。[应用回归](https://github.com/HANLINGVABCN/shellpilot-public/actions/runs/42603276178)全部通过，包含后台、AI/MCP、两端工作区页面、旧终端与数据保留。

          原数据目录保留，Android 沿用固定 ShellPilot 签名。工作区用于 Windows，Android 保留现有功能。外部 MCP 的权限与授权机器范围不变；工作区使用方法见 [说明](https://github.com/HANLINGVABCN/shellpilot-public/blob/main/docs/WORKSPACE.md)。

          聊天阅读仍只显示侧边向下箭头。

          Windows 安装使用 ShellPilot-Windows-Setup.exe；便携更新替换 shellpilot-app.exe；Android 使用 ShellPilot-arm64.apk。

          发布直接复制通过检查的构建文件，不重新编译或重新签名。
          NOTES
          printf '\n验证构建：https://github.com/%s/actions/runs/%s\n构建源码：`%s`\n' "$GITHUB_REPOSITORY" "$BUILD_RUN" "$BUILD_SOURCE_SHA" >> release-notes.md
      - name: Publish release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "$RELEASE_TITLE" --target "$GITHUB_SHA" \
            --notes-file release-notes.md --latest
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets

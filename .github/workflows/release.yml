name: publish-verified-build
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful Windows and Android build run ID'
        required: true
      tag:
        description: 'New release tag'
        required: true
        default: 'build-20261110-terminal-latency'
      title:
        description: 'Release title'
        required: true
        default: 'ShellPilot'
permissions:
  contents: write
  actions: read
concurrency:
  group: shellpilot-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful build matches main sources
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN")
          test "$(jq -r .status <<< "$run")" = completed
          test "$(jq -r .conclusion <<< "$run")" = success
          source_sha=$(jq -r .head_sha <<< "$run")
          git merge-base --is-ancestor "$source_sha" HEAD
          git diff --exit-code "$source_sha" HEAD -- src public server-rs src-tauri runtime index.html package.json package-lock.json vite.config.mjs scripts ':(exclude)scripts/verify-*'
          printf '%s\n' "BUILD_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new tag instead of replacing published files.' >&2
            exit 1
          fi
      - name: Download verified Windows files
        uses: actions/download-artifact@v4
        with:
          name: ShellPilot-windows-preview
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verified-windows
      - name: Download verified Android APK
        uses: actions/download-artifact@v4
        with:
          name: ShellPilot-android-preview
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verified-android
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          test -f verified-windows/shellpilot-app.exe
          cp verified-windows/shellpilot-app.exe release-assets/shellpilot-app.exe
          installer=$(find verified-windows -maxdepth 1 -type f -name '*.exe' ! -name 'shellpilot-app.exe' -print -quit)
          test -n "$installer"
          cp "$installer" release-assets/ShellPilot-Windows-Setup.exe
          apk=$(find verified-android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" release-assets/ShellPilot-arm64.apk
          test -f verified-android/ShellPilot-android.cer
          cp verified-android/ShellPilot-android.cer release-assets/
          cp verified-android/ANDROID-CERT-SHA256.txt release-assets/
          (cd release-assets && sha256sum ./*.exe ./*.apk > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          ShellPilot：修复终端输入回显卡顿。

          - SSH终端建连与重连独立处理，其他机器连接慢时不再堵住当前终端键盘输入。
          - 不同会话并行连接，同一会话去重；关闭未完成连接时清理任务，旧任务不会误关新会话。
          - Shell就绪即可交互，系统版本信息在后台探测。命令历史写入移出终端输入输出循环，行内建议按显示帧合并更新。
          - 连续输入、慢连接和慢系统探测的实际回显测试在GitHub运行，继续验证Bash/Zsh历史、Windows和手机布局。
          - 现有主机、聊天、记忆、工作区及备份功能保留，数据目录与永久安卓签名保持不变。

          Windows使用ShellPilot-Windows-Setup.exe，便携更新使用shellpilot-app.exe，安卓使用ShellPilot-arm64.apk。发布直接复用已经通过检查的安装包，不重复构建。
          NOTES
          printf '\n验证构建：https://github.com/%s/actions/runs/%s\n构建源码：`%s`\n' "$GITHUB_REPOSITORY" "$BUILD_RUN" "$BUILD_SOURCE_SHA" >> release-notes.md
      - name: Publish release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "$RELEASE_TITLE" --target "$GITHUB_SHA" \
            --notes-file release-notes.md --latest
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets

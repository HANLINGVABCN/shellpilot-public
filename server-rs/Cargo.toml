[package]
name = "shellpilot-server"
authors = ["ShellPilot"]
version = "1.0.0"
edition = "2021"
description = "ShellPilot Rust backend (axum + russh), contract-compatible with the Node server/"

[lib]
name = "shellpilot_server"
path = "src/lib.rs"

[[bin]]
name = "shellpilot-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws","multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "io-std", "fs", "process"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
russh = "0.46"
async-trait = "0.1"
tokio-stream = "0.1"
tokio-util = { version="0.7",features=["io"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
rust-embed = "8"
mime_guess = "2"
percent-encoding = "2"
regex = "1"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
opt-level = 2
strip = true
lto = true
codegen-units = 1
panic = "abort"

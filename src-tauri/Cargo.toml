[package]
name = "shellpilot-app"
authors = ["ShellPilot"]
version = "1.0.0"
description = "ShellPilot - AI SSH 工作台"
edition = "2021"

[lib]
name = "shellpilot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
serde_json = "1"
shellpilot-server = { path = "../server-rs" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
opt-level = 2
strip = true
lto = true
codegen-units = 1
panic = "abort"
